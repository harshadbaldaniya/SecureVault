# SecureVault edge: TLS termination, security headers, rate limits, the static SPA, and the reverse proxy to the
# backend. Only this container is published to the host; the backend, worker, database and Redis are not.

server_tokens off;

# Query strings can carry search terms and filters, so log the path only. Each server block sets access_log itself:
# a directive at server level replaces the stock http-level one (which logs the full request line).
log_format sv '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent rt=$request_time';

# Rate limits (defense in depth: Django also throttles per user and per IP).
limit_req_zone  $binary_remote_addr zone=sv_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=sv_api:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sv_conn:10m;
limit_req_status  429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sv_backend {
    server backend:8000;
    keepalive 16;
}

# Plain HTTP: health probe, and everything else redirects to HTTPS.
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout sv;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    access_log /dev/stdout sv;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # With a CA-issued certificate, also enable OCSP stapling (ssl_stapling on; ssl_stapling_verify on; resolver ...;).

    # Resource and abuse limits.
    client_max_body_size 3m;  # Excel imports are capped at 2 MB; JSON bodies are tiny.
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn sv_conn 40;

    root /usr/share/nginx/html;

    # Operational metrics are for the internal network only (a scraper reaches the backend directly).
    location = /api/v1/metrics/ {
        return 404;
    }

    # Credential-guessing targets get a much tighter limit than the rest of the API.
    location ~ ^/api/v1/auth/(login|mfa/verify|password-reset|invitations/accept)/ {
        limit_req zone=sv_login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/ {
        limit_req zone=sv_api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Real-time events. The application authenticates the handshake itself (session cookie + Origin check) and
    # enforces lockdown on the API regardless of this socket.
    location /ws/ {
        proxy_pass http://sv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;  # Daphne pings idle sockets every 20 s, so a live socket never reaches this
    }

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # The single-page app; unknown paths fall back to index.html and the router shows its own 404.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
