# Reverse proxy to the Django/Daphne backend for /api/.
proxy_pass http://sv_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
# The original Host (with port) so Django's CSRF origin check and ALLOWED_HOSTS see what the browser used.
proxy_set_header Host $http_host;
# Overwrite, never append: whatever a client puts in X-Forwarded-For is discarded, so the last (only) entry is the
# real peer address. Django is configured with DJANGO_NUM_PROXIES=1 to trust exactly this one hop.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

# One source of truth for response headers at the edge.
proxy_hide_header Cache-Control;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/security-headers.conf;
