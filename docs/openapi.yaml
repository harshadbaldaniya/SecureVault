          type: boolean
        require_symbols:
          type: boolean
        max_password_age_days:
          type: integer
          maximum: 3650
          minimum: 0
          description: 0 means credentials never expire.
        expiry_warning_days:
          type: integer
          maximum: 365
          minimum: 0
        allow_view_once:
          type: boolean
        max_share_duration_days:
          type: integer
          maximum: 365
          minimum: 1
        require_device_trust:
          type: boolean
        require_mfa:
          type: boolean
        block_on_high_risk:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
