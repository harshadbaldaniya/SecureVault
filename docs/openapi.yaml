openapi: 3.0.3
info:
  title: SecureVault API
  version: 1.0.0
paths:
  /api/v1/access-requests/:
    get:
      operationId: access_requests_list
      description: Requests you made (box=mine) or that await your decision as a credential
        owner (box=to_approve).
      parameters:
      - in: query
        name: box
        schema:
          type: string
          enum:
          - mine
          - to_approve
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - access-requests
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessRequestList'
          description: ''
    post:
      operationId: access_requests_create
      description: Requests you made (box=mine) or that await your decision as a credential
        owner (box=to_approve).
      tags:
      - access-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/access-requests/{id}/:
    get:
      operationId: access_requests_retrieve
      description: Requests you made (box=mine) or that await your decision as a credential
        owner (box=to_approve).
      parameters:
      - in: path
        name: id
