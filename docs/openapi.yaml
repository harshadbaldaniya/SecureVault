  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Read-only audit trail. There is deliberately no create/update/delete
        endpoint.
      parameters:
      - in: query
        name: action
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCESS_REQUEST
            - ACCOUNT_ACTIVATE
            - ANOMALY_REVIEW
            - APPROVAL
            - COPY
            - CREATE
            - DELETE
            - DEVICE_TRUST_CHANGE
            - EDIT
            - EMPLOYEE_IMPORT
            - INVITE
            - KEY_ROTATION
            - LOCKDOWN
            - LOGIN
            - LOGOUT
            - MFA_DISABLE
            - MFA_ENROLL
            - MFA_RESET
            - PASSWORD_CHANGE
            - PASSWORD_RESET
            - PASSWORD_RESET_REQUEST
            - POLICY_CHANGE
            - REJECTION
            - REPORT_EXPORT
            - REVEAL
            - REVOKE
            - SHARE
        description: |-
          * `LOGIN` - Login
          * `LOGOUT` - Logout
          * `REVEAL` - Reveal
          * `COPY` - Copy
          * `CREATE` - Create
          * `EDIT` - Edit
          * `DELETE` - Delete
          * `SHARE` - Share
          * `REVOKE` - Revoke
          * `INVITE` - Invite
          * `ACCOUNT_ACTIVATE` - Account Activate
          * `KEY_ROTATION` - Key Rotation
          * `ANOMALY_REVIEW` - Anomaly Review
          * `REPORT_EXPORT` - Report Export
          * `MFA_ENROLL` - Mfa Enroll
          * `MFA_DISABLE` - Mfa Disable
          * `MFA_RESET` - Mfa Reset
          * `PASSWORD_CHANGE` - Password Change
          * `PASSWORD_RESET_REQUEST` - Password Reset Request
          * `PASSWORD_RESET` - Password Reset
          * `ACCESS_REQUEST` - Access Request
          * `APPROVAL` - Approval
          * `REJECTION` - Rejection
          * `DEVICE_TRUST_CHANGE` - Device Trust Change
          * `LOCKDOWN` - Lockdown
          * `EMPLOYEE_IMPORT` - Employee Import
          * `POLICY_CHANGE` - Policy Change
        explode: true
        style: form
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - DENIED
          - FAILURE
          - SUCCESS
        description: |-
          * `SUCCESS` - Success
          * `FAILURE` - Failure
          * `DENIED` - Denied
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: request_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
