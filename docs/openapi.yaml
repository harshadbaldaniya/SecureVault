  /api/v1/alerts/:
    get:
      operationId: alerts_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACKNOWLEDGED
          - DISMISSED
          - OPEN
        description: |-
          * `OPEN` - Open
          * `ACKNOWLEDGED` - Acknowledged
          * `DISMISSED` - Dismissed
      - in: query
        name: type
        schema:
          type: string
          enum:
          - FINGERPRINT_MISMATCH
          - NEW_DEVICE
          - NEW_NETWORK
          - REVEAL_BURST
          - UNTRUSTED_DEVICE
        description: |-
          * `NEW_DEVICE` - Sign-in from a new device
          * `NEW_NETWORK` - Sign-in from an unfamiliar network
          * `UNTRUSTED_DEVICE` - Sensitive action blocked on an untrusted device
          * `REVEAL_BURST` - Unusually many secrets revealed
          * `FINGERPRINT_MISMATCH` - Device signals changed
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - alerts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
