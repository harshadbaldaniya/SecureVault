components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 128
        password:
          type: string
          writeOnly: true
          maxLength: 256
      required:
      - password
      - token
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        credential:
          type: string
          format: uuid
          readOnly: true
        credential_title:
          type: string
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        approver_name:
          type: string
          readOnly: true
        permission:
          allOf:
          - $ref: '#/components/schemas/RequestPermissionEnum'
          readOnly: true
        requested_duration_hours:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision_note:
          type: string
          readOnly: true
        share:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approver_name
      - created_at
      - credential
      - credential_title
      - decided_at
      - decision_note
      - expires_at
      - id
      - owner_name
      - permission
      - reason
      - requested_duration_hours
      - requester_name
      - share
      - state
